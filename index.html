<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SIDEQUEST">
  <meta name="description" content="Less scrolling. More living. A tiny real-world adventure game with 120 fun quests.">
  <meta name="color-scheme" content="light">
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <title>SIDEQUEST — Make boredom playable</title>
</head>
<body>
  <noscript><p style="padding:24px;font-family:sans-serif">SIDEQUEST needs JavaScript to show your quests. Please enable JavaScript.</p></noscript>
  <main id="app" class="app-shell" aria-live="off"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script src="./quests.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
